spring:
  config:
    activate:
      on-profile: prod              # ← active=dev 일 때만 적용
  jpa:
    show-sql: true
    properties:
      dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update               # Dev/운영 스키마 보호
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_PROD_HOST}:${DB_PROD_PORT}/${DB_PROD_DATABASE}?useSSL=false&useUnicode=true&allowPublicKeyRetrieval=true
    username: ${DB_PROD_USERNAME}
    password: ${DB_PROD_PASSWORD}
    # 커넥션 풀 관리
    maximum-pool-size: 20
    minimum-idle: 5
    connection-timeout: 20000
    idle-timeout: 300000
    max-lifetime: 1200000
    leak-detection-threshold: 60000

app:
  cookie:
    domain: ""
    secure: true
    same-site: "None"

aws:
  region: ap-northeast-2 #asia/seoul
  s3:
    bucket: maidlab-bucket
    access-key: ${AWS_S3_ACCESSKEY}
    secret-key: ${AWS_S3_SECRETKEY}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  header: ${JWT_HEADER}
  prefix: ${JWT_PREFIX}
  expiration:
    access: ${JWT_EXPIRATION_ACCESS}
    refresh: ${JWT_EXPIRATION_REFRESH}

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URL}
    token-uri: https://oauth2.googleapis.com/token
    resource-uri: https://www.googleapis.com/oauth2/v2/userinfo

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

server:
  tomcat:
    threads:
      max: 200          # 최대 스레드 수
      min-spare: 10     # 최소 스레드 수
    connection-timeout: 20000
    max-connections: 8192
    accept-count: 100
    mbeanregistry:
      enabled: true